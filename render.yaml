# Render Blueprint: one free web service built from the Dockerfile.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: spherex-blink
    runtime: docker
    plan: free
    region: virginia          # closest to the SPHEREx bucket on Amazon S3 (us-east-1)
    healthCheckPath: /api/health
    autoDeployTrigger: commit
